<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilmHall — An Unique Distribution System</title>
<meta name="description" content="FilmHall — An Unique Distribution System. Select your zone.">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="world.js" defer></script>
</head>

<body>

<!-- Header -->
<header class="world-header">
  <a href="https://filmhall.in">
    <img src="logo.png" alt="FilmHall Logo" class="logo">
  </a>
  <h1 class="main-title">FILMHALL</h1>
  <p class="tagline">An Unique Distribution System</p>
</header>

<!-- Zone picker -->
<section class="zone-section">
  <h2>Select your Zone</h2>

  <div class="zone-container" id="zone-container">

    <!-- Fallback: Odisha is the only zone until HQ adds more.
         world.js replaces this grid when the CMS returns active zones. -->
    <div class="zone-card">
      <a href="https://odisha.filmhall.in">
        <img src="odisha-map.jpg" alt="Odisha Zone">
        <h3>Odisha</h3>
      </a>
    </div>

  </div>
</section>

<!-- Social -->
<section class="social">
  <h2>Follow Us</h2>
  <div class="icons">
    <a href="https://www.facebook.com/share/17n2kYjxau/" class="fb">Facebook</a>
    <a href="https://youtube.com/@filmhallodisha" class="yt">YouTube</a>
    <a href="https://www.instagram.com/filmhallodisha" class="ig">Instagram</a>
  </div>
</section>

<footer>
  <p>© 2026 FilmHall — An Unique Distribution System | All Rights Reserved</p>
</footer>

</body>
</html>
